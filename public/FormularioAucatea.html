<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Aucatea</title>
    <link href="/print.css" rel="stylesheet">


</head>

<body>
    <form>

        <div id="header">
            <h1>Aucatea</h1>
            <p>Associação Candidomotense de Apoio a Pessoas com Transtorno do Espectro Autista</p>
        </div>

        <div id="container">

            <label>
                Nome Completo:
                <input />
            </label>
            <div id="boxNascimento">
                <label>
                    Data de Nascimento:
                </label>
                <input id="dataNascimento" />
            </div>


            <div class="box">
                <div class="campos">
                    <label>
                        Endereço:
                        <input />
                    </label>
                </div>
                <div id="numResidencia">
                    <label>
                        Numero:
                        <input />
                    </label>

                </div>
            </div>

            <div class="box">
                <div class="campos">
                    <label>
                        Bairro:
                        <input />
                    </label>
                </div>
                <label>
                    CEP:
                    <input />
                </label>
            </div>

            <label>
                Complemento:
                <input type="email" name="email" />
            </label>

            <div class="box">
                <div class="campos">
                    <label>
                        Nome da Mãe:
                        <input />
                    </label>
                </div>
                <label>
                    Telefone Mãe:
                    <input />
                </label>
            </div>

            <div class="box">
                <div class="campos">

                    <label>
                        Nome do Pai:
                        <input />
                    </label>
                </div>
                <label>
                    Telefone Pai:
                    <input />
                </label>
            </div>
            <label>
                Email:
                <input type="email" name="email" />
            </label>
            <label>
                Instituição de Ensino:
                <input type="email" name="email" />
            </label>
            <label>
                Instituição de Ensino(Fora Cândido Mota):
                <input type="email" name="email" />
            </label>
            <div id="boxLaudo">

                <div id="convenio">
                    <label>
                        Laudo:
                    </label>
                    <input />

                </div>
                <div id="convenio">
                    <label>
                        Convenio:
                    </label>
                    <input />

                </div>

            </div>
            <label>
                Terapias:
                <input id="terapia" />
            </label>

            <div id="assinatura">
                <p>Cândido Mota, <span id="data"></span></p>
                <hr id="linhaAssinatura">
                <p>Assinatura do Responsável</p>
            </div>




        </div>


    </form>


    <script>
        // Pega a data atual e formata no padrão brasileiro
        const hoje = new Date();
        const opcoes = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById("data").textContent = hoje.toLocaleDateString('pt-BR', opcoes);
    </script>



</body>

</html>
