<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Aucatea</title>
    <link href="/print.css" rel="stylesheet">


</head>

<body>
    <form>

        <div id="header">
            <h1>Aucatea</h1>
            <p>Associação Candidomotense de Apoio a Pessoas com Transtorno do Espectro Autista</p>
        </div>

        <div id="container">

            <label>
                Nome Completo:
                <input id="nome" />
            </label>
            <div id="boxNascimento">
                <label>
                    Data de Nascimento:
                </label>
                <input id="dataNascimento" />
            </div>


            <div class="box">
                <div class="campos">
                    <label>
                        Endereço:
                        <input id="endereco" />
                    </label>
                </div>
                <div id="numResidencia">
                    <label>
                        Numero:
                        <input id="numero_residencia" />
                    </label>

                </div>
            </div>

            <div class="box">
                <div class="campos">
                    <label>
                        Bairro:
                        <input id="bairro" />
                    </label>
                </div>
                <label>
                    CEP:
                    <input id="cep" />
                </label>
            </div>

            <label>
                Complemento:
                <input id="complemento" />
            </label>

            <div class="box">
                <div class="campos">
                    <label>
                        Nome da Mãe:
                        <input id="nome_mae" />
                    </label>
                </div>
                <label>
                    Telefone Mãe:
                    <input id="telefone_mae" />
                </label>
            </div>

            <div class="box">
                <div class="campos">

                    <label>
                        Nome do Pai:
                        <input id="nome_pai" />
                    </label>
                </div>
                <label>
                    Telefone Pai:
                    <input id="telefone_pai" />
                </label>
            </div>
            <label>
                Email:
                <input id="email" />
            </label>
            <label>
                Instituição de Ensino:
                <input id="escola" />
            </label>
            <label>
                Instituição de Ensino(Fora Cândido Mota):
                <input id="escola_fora" />
            </label>
            <div id="boxLaudo">

                <div id="convenio">
                    <label>
                        Laudo:
                    </label>
                    <input id="laudo" />

                </div>
                <div id="convenio">
                    <label>
                        Convenio:
                    </label>
                    <input id="convenio_form" />

                </div>

            </div>
            <label>
                Terapias:
                <input id="terapia" />
            </label>

            <div id="assinatura">
                <p>Cândido Mota, <span id="data"></span></p>
                <hr id="linhaAssinatura">
                <p>Assinatura do Responsável</p>
            </div>




        </div>


    </form>


    <script>
        window.onload = () => {
            const paciente = JSON.parse(localStorage.getItem("paciente"));
            if (paciente) {
                document.querySelector("#nome").value = paciente.nome;
                document.querySelector("#dataNascimento").value = new Date(paciente.data_nascimento).toLocaleDateString("pt-BR");
                document.querySelector("#endereco").value = paciente.endereco;
                document.querySelector("#numero_residencia").value = paciente.numero_casa;
                document.querySelector("#bairro").value = paciente.bairro;
                document.querySelector("#cep").value = paciente.cep;
                document.querySelector("#complemento").value = paciente.complemento_endereco;
                document.querySelector("#nome_mae").value = paciente.nome_mae;
                document.querySelector("#telefone_mae").value = paciente.telefone_mae;
                document.querySelector("#nome_pai").value = paciente.nome_pai;
                document.querySelector("#telefone_pai").value = paciente.telefone_pai;
                document.querySelector("#email").value = paciente.email_principal;
                document.querySelector("#escola").value = paciente.escola;
                document.querySelector("#escola_fora").value = paciente.escola_externa;
                document.querySelector("#convenio_form").value = paciente.convenio;
                document.querySelector("#laudo").value = paciente.laudo;
                document.querySelector("#terapia").value = paciente.tratamentos;
            }

            // Chama impressão automaticamente
            window.print();


            // Se quiser limpar logo após preencher:
            localStorage.removeItem("paciente");
        };


        // Pega a data atual e formata no padrão brasileiro
        const hoje = new Date();
        const opcoes = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById("data").textContent = hoje.toLocaleDateString('pt-BR', opcoes);
    </script>



</body>

</html>
