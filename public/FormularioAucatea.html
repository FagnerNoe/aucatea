<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Aucatea</title>
    <link href="/src/print.css" rel="stylesheet">
</head>

<body>
    <form>

        <div id="header">
            <h1>Aucatea</h1>
            <p>Associação Candidomotense de Apoio a Pessoas com Transtorno do Espectro Autista</p>
        </div>

        <div id="container">

            <label>
                Nome Completo:
                <input />
            </label>
            <div id="boxNascimento">
                <label>
                    Data de Nascimento:
                </label>
                <input id="dataNascimento" />
            </div>


            <div class="box">
                <div class="campos">
                    <label>
                        Endereço:
                        <input />
                    </label>
                </div>
                <div id="numResidencia">
                    <label>
                        Numero:
                        <input />
                    </label>

                </div>
            </div>

            <div class="box">
                <div class="campos">
                    <label>
                        Bairro:
                        <input />
                    </label>
                </div>
                <label>
                    CEP:
                    <input />
                </label>
            </div>

            <label>
                Complemento:
                <input type="email" name="email" />
            </label>

            <div class="box">
                <div class="campos">
                    <label>
                        Nome da Mãe:
                        <input />
                    </label>
                </div>
                <label>
                    Telefone Mãe:
                    <input />
                </label>
            </div>

            <div class="box">
                <div class="campos">

                    <label>
                        Nome do Pai:
                        <input />
                    </label>
                </div>
                <label>
                    Telefone Pai:
                    <input />
                </label>
            </div>
            <label>
                Email:
                <input type="email" name="email" />
            </label>
            <div id="convenio">
                <label>
                    Convenio:
                </label>
                <input />

            </div>
            <label>
                Terapias:
                <input id="terapia" />
                <input id="terapia" />
                <input id="terapia" />
            </label>


        </div>


    </form>





</body>

</html>
